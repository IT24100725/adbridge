<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Client Report</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.5; color: #333; }
        .report-container { width: 100%; max-width: 800px; margin: 20px auto; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        .report-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .report-header h1 { margin: 0; font-size: 24px; color: #0056b3; }
        .report-header p { margin: 5px 0 0; color: #666; }
        .report-body { margin-top: 20px; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .table th { background-color: #f2f2f2; font-weight: bold; }
        .footer { text-align: center; margin-top: 20px; font-size: 10px; color: #888; }
        .no-print { margin-top: 20px; text-align: center; }
        .print-button { padding: 10px 20px; font-size: 16px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
<div class="report-container">
    <div class="report-header">
        <h1 th:text="${reportType}">Client Report</h1>
        <p>Generated on: <span th:text="${generatedTime}"></span></p>
        <p>Period: <span th:text="${period}"></span></p>
    </div>

    <div class="report-body">
        <table class="table">
            <thead>
            <tr>
                <th>Client Name</th>
                <th>Total Campaigns</th>
                <th>Total Spent (LKR)</th>
                <th>Favorite Service</th>
                <th>Last Campaign Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="detail : ${clientDetails}">
                <td th:text="${detail.clientName}"></td>
                <td th:text="${detail.totalCampaigns}"></td>
                <td th:text="${#numbers.formatDecimal(detail.totalSpent, 1, 2)}"></td>
                <td th:text="${detail.favoriteService}"></td>
                <td th:text="${detail.lastCampaignDate != null ? #temporals.format(detail.lastCampaignDate, 'dd MMM yyyy') : 'N/A'}"></td>
            </tr>
            <tr th:if="${clientDetails == null or #lists.isEmpty(clientDetails)}">
                <td colspan="5" style="text-align: center; color: #888;">No client data available for this period.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <p>Generated by AdBridgeLanka</p>
    </div>

    <div class="no-print">
        <button class="print-button" onclick="window.print()">🖨️ Print/Save as PDF</button>
        <p><em>Use your browser's print function to save as PDF</em></p>
    </div>
</div>
</body>
</html>
