<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: adminLayout(~{::section})}">
<section>
    <div class="section-head" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">
        <h1 class="page-title">New Campaign</h1>
        <a class="btn" th:href="@{/admin/campaigns}">Back to Campaigns</a>
    </div>

    <div class="card">
        <!-- Structure only; backend wiring to be added later -->
        <form action="#" method="post" enctype="multipart/form-data" class="admin-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Campaign Name *</label>
                    <input id="name" name="name"
                           th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null" required>
                </div>
                <div class="form-group">
                    <label for="client">Client Name *</label>
                    <input id="client" name="client"
                           th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="serviceType">Service Type *</label>
                    <select id="serviceType" name="serviceType"
                            th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null">
                        <option>TV_ADVERTISEMENT</option>
                        <option>RADIO_PROMOTION</option>
                        <option>SOCIAL_MEDIA_CAMPAIGN</option>
                        <option>NEWSPAPER_AD</option>
                        <option>BILLBOARD_ADVERTISING</option>
                        <option>DIGITAL_BANNER</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="budget">Budget *</label>
                    <input id="budget" name="budget" type="number" min="0" step="1"
                           th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null" required>
                </div>
                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency" name="currency"
                            th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null">
                        <option>LKR</option>
                        <option>USD</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="start">Start Date *</label>
                    <input id="start" name="start" type="date"
                           th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null" required>
                </div>
                <div class="form-group">
                    <label for="end">End Date *</label>
                    <input id="end" name="end" type="date"
                           th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" disabled>
                        <option>DRAFT</option>
                        <option>PENDING</option>
                        <option>APPROVED</option>
                        <option>REJECTED</option>
                        <option>EXPIRED</option>
                    </select>
                    <small class="muted">Status is set by workflow (Director approves/rejects)</small>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Notes / Description</label>
                <textarea id="notes" name="notes" rows="4"
                          th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null"></textarea>
            </div>

            <div class="form-group">
                <label>Creative Files (images/videos/PDF, up to 10MB each)</label>
                <input type="file" name="files" multiple
                       th:attr="${adminRole != null and (adminRole.name()=='SUPPORT')}? 'disabled' : null">
                <small class="muted">Files will be stored in Documents and linked here (placeholder)</small>
            </div>

            <div class="form-group">
                <label>Assign Tasks</label>
                <div class="muted">You can create tasks after saving (placeholder link to Tasks)</div>
            </div>

            <div class="form-actions">
                <!-- Marketing or Super Admin can create/submit -->
                <span th:if="${adminRole != null and (adminRole.name()=='MARKETING' or adminRole.name()=='SUPER_ADMIN')}">
                    <button type="submit" class="btn">Save Draft</button>
                    <button type="submit" class="btn primary">Submit for Approval</button>
                </span>
                <!-- Director approval buttons shown in detail page normally; shown here as placeholders for Super Admin -->
                <span th:if="${adminRole != null and (adminRole.name()=='DIRECTOR' or adminRole.name()=='SUPER_ADMIN')}">
                    <button type="button" class="btn">Approve</button>
                    <button type="button" class="btn danger">Reject</button>
                </span>
            </div>
        </form>
    </div>

    <footer class="admin-footer-sticky">
        © 2025 AdBridgeLanka · Admin
    </footer>
</section>
</html>
