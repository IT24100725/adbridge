<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section>
    <div class="section-head">
        <h1 class="page-title">Your Notifications</h1>
    </div>

    <!-- Simple Notifications Table -->
    <div class="table-container" th:if="${notifications != null and !notifications.empty}">
        <table class="notification-table">
            <thead>
                <tr>
                    <th>Message (Client Request)</th>
                    <th>Reply (CSO Response)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="notification : ${notifications}" 
                    th:class="'notification-row' + (${notification.isRead} ? ' read' : ' unread')"
                    class="notification-row">
                    <td data-label="Message" th:text="${notification.message}">Client request message</td>
                    <td data-label="Reply" th:text="${notification.title}">CSO reply message</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Welcome message when no notifications -->
    <div th:if="${notifications == null or notifications.empty}" class="welcome-message">
        <div class="welcome-icon">🔔</div>
        <h2>No Notifications Yet</h2>
        <p>You'll see your client requests and CSO replies here once they start coming in.</p>
    </div>
</section>

<style>
/* Clean Modern Notification Styles */
.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
}

.page-title {
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--text-heading);
    margin: 0;
}

.section-actions {
    display: flex;
    gap: 1rem;
    align-items: center;
}

/* Clean Summary Cards */
.notification-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2.5rem;
}

.summary-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transition: all 0.2s ease;
}

.summary-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.summary-card.create-client {
    border-left: 3px solid #4CAF50;
}

.summary-card.cancel-booking {
    border-left: 3px solid #f44336;
}

.summary-card.rejected-booking {
    border-left: 3px solid #ff9800;
}

.summary-card.general-inquiry {
    border-left: 3px solid #2196F3;
}

.summary-icon {
    font-size: 1.5rem;
    width: 2.5rem;
    height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: white;
}

.summary-card.create-client .summary-icon {
    background: #4CAF50;
}

.summary-card.cancel-booking .summary-icon {
    background: #f44336;
}

.summary-card.rejected-booking .summary-icon {
    background: #ff9800;
}

.summary-card.general-inquiry .summary-icon {
    background: #2196F3;
}

.summary-content h3 {
    margin: 0 0 0.25rem 0;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-heading);
}

.summary-content p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.8rem;
}

/* Clean Notification Sections */
.notification-section {
    margin-bottom: 2.5rem;
}

.section-header {
    margin-bottom: 1rem;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0;
    color: var(--text-heading);
}

.section-icon {
    font-size: 1rem;
    width: 1.5rem;
    height: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: white;
}

.section-title.create-client .section-icon {
    background: #4CAF50;
}

.section-title.cancel-booking .section-icon {
    background: #f44336;
}

.section-title.rejected-booking .section-icon {
    background: #ff9800;
}

.section-title.general-inquiry .section-icon {
    background: #2196F3;
}

.badge {
    background: var(--bg-alt);
    color: var(--text-dim);
    padding: 0.2rem 0.6rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-left: auto;
}

/* Clean Table Styles */
.table-container {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.notification-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
}

.notification-table th {
    background: var(--bg-alt);
    color: var(--text-heading);
    font-weight: 600;
    padding: 0.75rem 1rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.notification-table td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    max-width: 300px;
}

.notification-table td:first-child {
    font-weight: 600;
    color: var(--text-heading);
}

.notification-table td:nth-child(2) {
    color: var(--text);
    line-height: 1.4;
    word-wrap: break-word;
}

.notification-table td:nth-child(3) {
    color: var(--text-dim);
    font-size: 0.8rem;
    white-space: nowrap;
}

.notification-row.unread {
    background: var(--accent-bg-faded);
}

.notification-row.read {
    opacity: 0.6;
}

.notification-row:hover {
    background: var(--bg-alt);
}

.status-badge {
    padding: 0.2rem 0.6rem;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
}

.status-badge.unread {
    background: #e3f2fd;
    color: #1976d2;
}

.status-badge.read {
    background: #f5f5f5;
    color: #666;
}

/* Clean Button Styles */
.btn-v2 {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s ease;
    cursor: pointer;
}

.btn-v2.secondary {
    background: var(--bg-alt);
    color: var(--text);
    border: 1px solid var(--border);
}

.btn-v2.secondary:hover {
    background: var(--border);
    color: var(--text-heading);
}

.btn-v2.primary {
    background: var(--accent);
    color: white;
}

.btn-v2.primary:hover {
    background: var(--accent-dark);
}

.btn-v2.xs {
    padding: 0.4rem 0.8rem;
    font-size: 0.75rem;
}

/* Clean Welcome message */
.welcome-message {
    text-align: center;
    padding: 3rem 2rem;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    border-radius: 8px;
    color: white;
    margin: 2rem 0;
}

.welcome-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
}

.welcome-message h2 {
    font-size: 1.5rem;
    margin: 0 0 1rem 0;
    font-weight: 600;
}

.welcome-message p {
    font-size: 1rem;
    margin: 0 0 1rem 0;
    opacity: 0.9;
}

.welcome-message ul {
    text-align: left;
    max-width: 400px;
    margin: 0 auto 1rem auto;
    font-size: 0.9rem;
    opacity: 0.9;
}

.welcome-message li {
    margin: 0.25rem 0;
    padding-left: 0.5rem;
}

.welcome-message strong {
    font-size: 1rem;
    opacity: 1;
}

/* Responsive Design */
@media (max-width: 768px) {
    .section-head {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
    }
    
    .notification-summary {
        grid-template-columns: 1fr;
    }
    
    .notification-table {
        font-size: 0.8rem;
    }
    
    .notification-table th,
    .notification-table td {
        padding: 0.5rem;
    }
    
    .welcome-message {
        padding: 2rem 1rem;
    }
    
    .welcome-icon {
        font-size: 2.5rem;
    }
    
    .welcome-message h2 {
        font-size: 1.25rem;
    }
}
</style>
</html>
